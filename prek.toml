[[repos]]
repo = "local"

[[repos.hooks]]
id = "update-readme"
name = "Regenerate README event table"
entry = "bash -c 'python3 skill/scripts/update_readme.py && git add README.md'"
language = "system"
files = '^data/.*\.json$'
pass_filenames = false

[[repos.hooks]]
id = "aggregate"
name = "Regenerate aggregations"
entry = "bash -c 'python3 skill/scripts/aggregate.py && git add agg/ viz/agg/'"
language = "system"
files = '^data/.*\.json$'
pass_filenames = false

[[repos.hooks]]
id = "generate-viz"
name = "Regenerate event viz pages"
entry = "bash -c 'python3 skill/scripts/generate_md.py && git add viz/'"
language = "system"
files = '^data/.*\.json$'
pass_filenames = false
